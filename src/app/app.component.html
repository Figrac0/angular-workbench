<app-header />

<nav class="top-nav">
  <div class="nav-inner">
    @for (tab of tabs; track tab.key) {
      <button
        class="tab"
        [class.active]="view() === tab.key"
        (click)="view.set(tab.key)"
      >
        <span class="icon">{{ tab.icon }}</span>
        <span class="label">{{ tab.label }}</span>
        <span class="count">{{ badges()[tab.key] }}</span>
      </button>
    }
  </div>
</nav>

<main>
  @switch (view()) {
    @case ('dashboard') { <app-dashboard /> }
    @case ('board') { <app-board /> }
    @case ('members') { <app-members /> }
    @case ('teams') { <app-teams /> }
  }
</main>
