@if (isAddingTask) {
  <app-new-task
    (close)="onCloselAddTask()"
    (add)="onAddTask($event)"
    [userId]="userId"
  />
}

<section id="tasks">
  <header>
    <h2>{{ name }}</h2>
    <menu>
      <button (click)="onNewTask()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for (task of selectedUSerTasks; track task.id) {
      <li>
        <app-task [task]="task" />
      </li>
    }
  </ul>
</section>
